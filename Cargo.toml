[package]
name = "mos-projects"
version = "0.1.0"
edition = "2024"
resolver = "3"


[build-dependencies]
bootloader = "0.11"
mos = { path = "mos", artifact = "bin", target = "x86_64-unknown-none", default-features = true }
test_syscall = { path = "user_space/test_syscall", artifact = "bin", target = "x86_64-unknown-none" }

[dependencies]
# used for UEFI booting in QEMU
ovmf-prebuilt = "0.1.0-alpha.1"

[workspace]
members = ["allocators", "mos", "vga", "user_space/green_thread", "bitmap", "optional", "psf", "buddy_allocator", "ppm", "user_space/test_syscall", "ramfs_builder", "ramfs", "kernel_utils", "vfs", "user_space/test_gp", "user_space/test_rand", "user_space/test_exit"]

[features]
uefi = []
default = ["uefi"]

[profile.release]
opt-level = 3
debug = false
lto = true
