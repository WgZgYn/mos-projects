[package]
name = "mos-projects"
version = "0.1.0"
edition = "2024"
resolver = "3"


[dependencies]
# used for UEFI booting in QEMU
ovmf-prebuilt = "0.2.7"
clap = { version = "4.5.53", features = ["derive"] }
env_logger = "0.11.8"
ramfs_builder = { path = "ramfs_builder" }
bootloader = "0.11.13"
log = "0.4.28"
bootloader-boot-config = "0.11.13"

[workspace]
members = ["allocators", "mos", "vga", "green_thread", "bitmap", "optional", "psf", "buddy_allocator", "ppm", "ramfs_builder", "ramfs", "kernel_utils", "vfs", "user_space", "bs_string"]

[features]
map_ramfs = []
uefi = []
default = ["uefi", "map_ramfs"]

[profile.release]
opt-level = 3
debug = false
lto = true