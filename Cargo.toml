[package]
name = "mos-projects"
version = "0.1.0"
edition = "2024"
resolver = "3"

[build-dependencies]
bootloader = "0.11"
mos = { path = "mos", artifact = "bin", target = "x86_64-unknown-none", features = ["intr_apic"], default-features = false }

[dependencies]
# used for UEFI booting in QEMU
ovmf-prebuilt = "0.1.0-alpha.1"

[workspace]
members = ["allocators", "mos", "vga", "user_space/green_thread", "bitmap"]

[features]
uefi = []
default = ["uefi"]

[profile.release]
opt-level = 3
debug = false
lto = true
