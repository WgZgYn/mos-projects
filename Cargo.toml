[package]
name = "mos-projects"
version = "0.1.0"
edition = "2024"
resolver = "3"


[dependencies]
# used for UEFI booting in QEMU
ovmf-prebuilt = "0.2.7"
clap = { version = "4.5.59", features = ["derive"] }
env_logger = "0.11.9"
log = "0.4.29"
bootloader = "0.11.15"
bootloader-boot-config = "0.11.15"
ramfs_builder = { path = "ramfs_builder" }
serde_json = "1.0.149"
user = { path = "user" }


[workspace]
members = ["libs/allocators", "mos", "libs/vga", "libs/green_thread", "libs/bitmap", "libs/optional", "libs/psf", "libs/buddy_allocator", "libs/ppm", "ramfs_builder", "fs/ramfs", "kernel_utils", "vfs", "user/user_space", "libs/bs_string", "libs/collections", "libs/note", "fs/mem_fs", "ktests", "mos_lib", "libs/elf_parser"]
exclude = ["user/test_dyn", "user/test_dyn_bin", "user"]

[features]
map_ramfs = []
uefi = []
default = ["uefi", "map_ramfs"]

[profile.release]
opt-level = 3
debug = false
lto = true
