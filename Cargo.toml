[package]
name = "mos-projects"
version = "0.1.0"
edition = "2024"
resolver = "3"


[dependencies]
# used for UEFI booting in QEMU
ovmf-prebuilt = "0.2.9"
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.35"
bootloader = "0.11.17"
bootloader-boot-config = "0.11.17"
ramfs_builder = { path = "ramfs_builder" }
serde_json = "1.0.154"
user = { path = "user" }


[workspace]
members = [
    "libs/*",
    "vfs_*",
    "fs/*",
    "ramfs_builder",
    "mos", "mos_*",
    "ktests",
]
exclude = ["user"]

[features]
map_ramfs = []
uefi = []
default = ["uefi", "map_ramfs"]

[profile.release]
opt-level = 3
debug = false
lto = true
