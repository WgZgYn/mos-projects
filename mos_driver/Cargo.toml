[package]
name = "mos_driver"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4.29"
pc-keyboard = "0.8.0"
conquer-once = { version = "0.4.0", default-features = false }
crossbeam-queue = { version = "0.3.12", features = ["alloc"], default-features = false }
futures-util = { version = "0.3.31", default-features = false, features = ["alloc"] }
lazy_static = { version = "1.5.0", features = ["spin_no_std"] }
uart_16550 = "0.6.0"
noto-sans-mono-bitmap = { version = "0.3.2", features = ["size_20", "unicode-specials"] }
bootloader_api = "0.11.14"
mos_lib = { path = "../mos_lib" }
mos_arch = { path = "../mos_arch" }
mos_task = { path = "../mos_task" }
x86_64 = "0.15.4"
spin = "0.10.0"